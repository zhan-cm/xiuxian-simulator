[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiuxian-simulator"
version = "0.4.0"
description = "《问道长生》规则驱动的本地修仙文字模拟器 V0.4"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
xiuxian = "xiuxian_simulator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
