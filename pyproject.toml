[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiuxian-simulator"
version = "0.44.0"
description = "《问道长生》规则驱动的本地修仙文字模拟器 V0.44 新世演化版"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.12,<3",
    "pytest>=8,<9",
]

[project.scripts]
xiuxian = "xiuxian_simulator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
