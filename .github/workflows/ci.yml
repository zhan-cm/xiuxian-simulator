name: 持续集成

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-engine:
    name: Python 规则引擎
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装项目与测试依赖
        run: python -m pip install -e ".[dev]"
      - name: 全量规则回归
        run: python -m pytest
      - name: 发布树启动自检
        run: python -m xiuxian_simulator --check
      - name: Windows 发布清单检查
        run: python scripts/package_release.py --check
      - name: Windows 发布包端到端验收
        run: |
          python scripts/package_release.py
          python scripts/verify_release.py --smoke

  modern-interface:
    name: React 游戏界面
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装锁定依赖
        run: npm ci
      - name: 静态检查
        run: npm run lint
      - name: 组件测试
        run: npm test
      - name: 生产构建
        run: npm run build
      - name: 验证生产资源完整性
        run: npm run verify:dist
